[build-system]
requires = ["setuptools>=68.0", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "pricing"
version = "0.1.0"
requires-python = ">=3.9"
dependencies = [
    "pyspark>=3.5",
    "delta-spark>=3.0",
    "pandas>=2.0",
    "numpy>=1.24",
    "scikit-learn>=1.3",
    "pymc>=5.10",
    "arviz>=0.17",
    "pytensor",
]

[project.optional-dependencies]
dev = [
    "pytest>=7.0",
    "ruff>=0.4",
]

[tool.ruff]
target-version = "py39"
line-length = 120

[tool.ruff.lint.per-file-ignores]
# Notebooks use %run for shared scope — ruff can't see injected names
"notebooks/00_config.py" = ["E402"]
"notebooks/01_functions.py" = ["F821"]
"notebooks/02_exploration.py" = ["F821"]
"notebooks/03_feature_engineering.py" = ["F821"]
"notebooks/04_model_training.py" = ["F821"]
"notebooks/05_evaluation.py" = ["F821", "F401"]

[tool.pytest.ini_options]
testpaths = ["tests"]
